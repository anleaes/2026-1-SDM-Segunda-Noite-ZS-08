{% extends 'base.html' %}

{% block title %}

    Adicionar Refeicoes - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Refeicao</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data"> 
{% csrf_token %}
    <label>Alimentos da refeicao</label>
    <br />
    {{ form.alimentos}}
    <br />
    <br />
    <label>Plano Alimentar</label>
    <br />
    {{ form.plano_alimentar}}
    <br />
    <br />
    <label>Nome da Refeição</label>
    <br />
    {{ form.nome}}
    <br />
    <br />
    <label>Horário</label>
    <br />
    {{ form.horario }}
    <br />
    <br />
    <label>Descrição</label>
    <br />
    {{ form.descricao }}
    <br />
    <br />
    <button type="submit">Salvar</button>       
</form>

{% endblock body %}
